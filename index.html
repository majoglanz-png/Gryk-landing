<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRYK — Tu frozen yogurt te está esperando</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #0d5fe6; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem; }
    .bg-letters { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .bg-letter { position: absolute; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 180px; color: rgba(255,255,255,0.06); line-height: 1; user-select: none; }
    .l1 { top: -20px; left: -10px; } .l2 { top: -20px; right: 20px; transform: rotate(8deg); } .l3 { bottom: -40px; left: 10px; transform: rotate(-5deg); } .l4 { bottom: -40px; right: -10px; transform: rotate(12deg); }
    .card { background: #f4ecbe; border-radius: 24px; width: 100%; max-width: 420px; position: relative; z-index: 1; overflow: hidden; }
    .card-top { background: #043584; padding: 1.75rem; position: relative; overflow: hidden; }
    .ct-letter { position: absolute; font-family: 'Syne', sans-serif; font-weight: 800; color: rgba(255,255,255,0.06); font-size: 120px; line-height: 1; user-select: none; pointer-events: none; }
    .ctl1 { top: -15px; right: -5px; } .ctl2 { bottom: -30px; left: 10px; }
    .logo-area { display: flex; align-items: center; gap: 10px; margin-bottom: 1.25rem; position: relative; z-index: 1; }
    .logo-icon { width: 38px; height: 38px; background: #0d5fe6; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .logo-text { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 20px; color: #fff; letter-spacing: 0.04em; display: block; }
    .logo-sub { font-size: 9px; font-weight: 500; color: rgba(255,255,255,0.45); letter-spacing: 0.16em; text-transform: uppercase; display: block; }
    .badge { display: inline-flex; align-items: center; gap: 6px; background: #0d5fe6; color: #f4ecbe; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 12px; border-radius: 100px; margin-bottom: 1rem; position: relative; z-index: 1; }
    .badge-dot { width: 6px; height: 6px; background: #f4ecbe; border-radius: 50%; animation: pulse 2s infinite; flex-shrink: 0; }
    @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.4; transform:scale(0.6); } }
    .headline { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 36px; line-height: 1.08; color: #fff; position: relative; z-index: 1; margin-bottom: 0.5rem; }
    .headline em { font-style: normal; color: #f4ecbe; }
    .subhead { font-size: 14px; color: rgba(255,255,255,0.6); line-height: 1.5; position: relative; z-index: 1; }
    .steps { display: flex; margin-top: 1.25rem; position: relative; z-index: 1; }
    .step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
    .step:not(:last-child)::after { content: ''; position: absolute; top: 13px; left: 58%; width: 84%; height: 1px; background: rgba(255,255,255,0.12); }
    .step-num { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #f4ecbe; }
    .step-label { font-size: 10px; color: rgba(255,255,255,0.4); text-align: center; font-weight: 500; }
    .card-body { padding: 1.5rem 1.75rem 1.75rem; }
    .field { margin-bottom: 1rem; }
    .field-label { display: block; font-size: 11px; font-weight: 600; color: #043584; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
    .field-input { width: 100%; background: #fff; border: 1.5px solid rgba(13,95,230,0.18); border-radius: 10px; padding: 0.75rem 1rem; font-size: 15px; font-family: 'DM Sans', sans-serif; color: #043584; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    .field-input:focus { border-color: #0d5fe6; box-shadow: 0 0 0 3px rgba(13,95,230,0.1); }
    .field-input::placeholder { color: #8fc2ef; }
    .field-input:disabled { opacity: 0.6; }
    .btn { width: 100%; background: #0d5fe6; color: #fff; border: none; border-radius: 10px; padding: 0.9rem; font-size: 15px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; margin-top: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s, transform 0.1s; }
    .btn:hover { background: #043584; } .btn:active { transform: scale(0.98); } .btn:disabled { opacity: 0.65; cursor: not-allowed; }
    .error-msg { background: #fee2e2; color: #b91c1c; border-radius: 8px; padding: 0.6rem 0.9rem; font-size: 13px; margin-top: 0.75rem; display: none; }
    .fine-print { font-size: 11px; color: #8b634b; text-align: center; margin-top: 1rem; line-height: 1.5; }
    .invalid-section { text-align: center; padding: 1.5rem 0.5rem; display: none; }
